
spring.application.name=product_service

# MySQL connection: "mysql" is the Docker Compose service name
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/product_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:product_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

server.port=${SERVER_PORT:8087}
